<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imanmaker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
        }

        h1 {
            padding: 16px 20px;
            font-size: 22px;
            border-bottom: 1px solid #e9ecef;
        }

        h2 {
            font-size: 16px;
            margin-bottom: 10px;
        }

        .barra {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            padding: 12px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        input[type="file"] {
            display: none;
        }

        button, .boton {
            display: inline-block;
            padding: 9px 16px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            user-select: none;
        }

        button:hover, .boton:hover {
            background: #545b62;
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .boton.azul {
            background: #007bff;
        }

        .boton.azul:hover {
            background: #0056b3;
        }

        button.verde {
            background: #28a745;
            font-weight: 500;
        }

        button.verde:hover {
            background: #218838;
        }

        button.peligro {
            background: #dc3545;
        }

        #estado {
            color: #6c757d;
            font-size: 14px;
        }

        #tira {
            display: flex;
            gap: 10px;
            padding: 12px 20px;
            overflow-x: auto;
            border-bottom: 1px solid #e9ecef;
            min-height: 96px;
            align-items: center;
        }

        #tira:empty::before {
            content: 'Elige fotos, arrástralas aquí o pégalas con Ctrl+V';
            color: #6c757d;
        }

        .mini {
            flex: 0 0 auto;
            position: relative;
            border: 3px solid transparent;
            border-radius: 50%;
            cursor: pointer;
            line-height: 0;
        }

        .mini.actual {
            border-color: #007bff;
        }

        .mini canvas {
            width: 66px;
            height: 66px;
            border-radius: 50%;
        }

        .mini .copias {
            position: absolute;
            right: -4px;
            bottom: -4px;
            background: #28a745;
            color: white;
            font-size: 12px;
            line-height: 1;
            padding: 3px 6px;
            border-radius: 10px;
        }

        .cuerpo {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        .editor {
            flex: 1 1 420px;
            min-width: 0;
        }

        .lado {
            flex: 1 1 300px;
            min-width: 0;
        }

        #lienzo {
            display: block;
            width: 100%;
            max-width: 620px;
            aspect-ratio: 1;
            margin: 0 auto;
            border: 1px solid #dee2e6;
            background: #e9ecef;
            cursor: grab;
            touch-action: none;
        }

        #lienzo.agarrando {
            cursor: grabbing;
        }

        .controles {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: center;
            margin-top: 12px;
        }

        .controles label, .opciones label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }

        .controles input[type="number"] {
            width: 56px;
            padding: 6px;
        }

        #aviso {
            margin-top: 10px;
            min-height: 20px;
            text-align: center;
            font-size: 14px;
            color: #b45309;
        }

        .leyenda {
            margin-top: 6px;
            text-align: center;
            font-size: 13px;
            color: #6c757d;
        }

        .opciones {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 14px;
        }

        #hojas {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 14px;
        }

        #hojas canvas {
            width: 180px;
            border: 1px solid #dee2e6;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        }

        .oculto {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Imanmaker</h1>

        <div class="barra">
            <label for="cargador" class="boton azul">📁 Añadir fotos</label>
            <input type="file" id="cargador" accept="image/*" multiple>
            <span id="estado"></span>
        </div>

        <div id="tira"></div>

        <div class="cuerpo oculto" id="cuerpo">
            <div class="editor">
                <canvas id="lienzo" width="900" height="900"></canvas>
                <div class="leyenda">
                    Arrastra para mover · rueda o pellizco para el tamaño ·
                    lo claro es lo que se ve (61 mm), lo oscuro se dobla por detrás (hasta 72 mm)
                </div>
                <div id="aviso"></div>
                <div class="controles">
                    <button id="menos" title="Más pequeña">−</button>
                    <button id="mas" title="Más grande">+</button>
                    <button id="rellenar" title="La foto cubre todo el imán">Rellenar</button>
                    <button id="entera" title="La foto entera dentro de lo que se ve">Foto entera</button>
                    <button id="girar" title="Girar 90°">⟳ Girar</button>
                </div>
                <div class="controles">
                    <label>Copias <input type="number" id="copias" min="1" max="60" value="1"></label>
                    <label>Fondo <input type="color" id="fondo" value="#ffffff"></label>
                    <button id="png" title="Guardar solo este imán, recortado en círculo">PNG de este imán</button>
                    <button id="quitar" class="peligro">Quitar</button>
                </div>
            </div>

            <div class="lado">
                <h2>Hoja para imprimir (A4)</h2>
                <div class="opciones">
                    <label><input type="checkbox" id="lineaCorte" checked> Línea de corte (72 mm)</label>
                    <label><input type="checkbox" id="lineaVisible"> Marcar lo que se ve (61 mm)</label>
                    <label><input type="checkbox" id="regla" checked> Regla de 50 mm para comprobar el tamaño</label>
                </div>
                <div id="hojas"></div>
                <button id="pdf" class="verde">💾 Descargar PDF</button>
                <div class="leyenda" style="text-align:left; margin-top:10px">
                    Al imprimir, elige «tamaño real» o «100 %», sin ajustar a la página.
                </div>
            </div>
        </div>
    </div>

    <script>
        // Todo va en píxeles a 300 ppp: un imán son 72 mm (850 px) y se ven 61 mm.
        const PPP = 300;
        const mm = (v) => v / 25.4 * PPP;
        const R_VISIBLE = mm(61) / 2;
        const R_CORTE = mm(72) / 2;

        // La hoja: un A4 con seis imanes (2 × 3), centrados.
        const HOJA = { ancho: 2480, alto: 3508, margenX: 340, margenY: 379, paso: 950, caja: 850, porHoja: 6 };

        const el = (id) => document.getElementById(id);

        class Iman {
            constructor(img, nombre) {
                this.img = img;
                this.nombre = nombre;
                this.rot = 0;
                this.copias = 1;
                this.fondo = '#ffffff';
                this.rellenar();
            }

            // Tamaño de la foto ya girada, en píxeles de la hoja.
            get ancho() { return (this.rot % 180 ? this.img.height : this.img.width) * this.escala; }
            get alto() { return (this.rot % 180 ? this.img.width : this.img.height) * this.escala; }

            get escalaRelleno() {
                return 2 * R_CORTE / Math.min(this.img.width, this.img.height);
            }

            rellenar() {
                this.escala = this.escalaRelleno;
                this.x = 0;
                this.y = 0;
            }

            entera() {
                this.escala = 2 * R_VISIBLE / Math.hypot(this.img.width, this.img.height);
                this.x = 0;
                this.y = 0;
            }

            // Cambia el tamaño dejando quieto el punto (px, py), medido desde el centro.
            zoom(factor, px = 0, py = 0) {
                const nueva = Math.max(this.escalaRelleno / 20, Math.min(this.escala * factor, this.escalaRelleno * 20));
                const real = nueva / this.escala;
                this.x = px - (px - this.x) * real;
                this.y = py - (py - this.y) * real;
                this.escala = nueva;
            }

            cubre(radio) {
                return Math.abs(this.x) + radio <= this.ancho / 2 + 0.5
                    && Math.abs(this.y) + radio <= this.alto / 2 + 0.5;
            }

            // Dibuja el imán centrado en (cx, cy). Con `recorte`, solo dentro de ese radio.
            dibujar(ctx, cx, cy, k, recorte, medio) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.scale(k, k);
                if (recorte) {
                    ctx.beginPath();
                    ctx.arc(0, 0, recorte, 0, 2 * Math.PI);
                    ctx.clip();
                }
                ctx.fillStyle = this.fondo;
                ctx.fillRect(-medio, -medio, 2 * medio, 2 * medio);
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rot * Math.PI / 180);
                ctx.scale(this.escala, this.escala);
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(this.img, -this.img.width / 2, -this.img.height / 2);
                ctx.restore();
            }
        }

        class Imanmaker {
            constructor() {
                this.imanes = [];
                this.actual = -1;
                this.lienzo = el('lienzo');
                this.ctx = this.lienzo.getContext('2d');
                this.dedos = new Map();
                this.pendienteHojas = null;
                this.eventos();
            }

            get iman() { return this.imanes[this.actual]; }

            eventos() {
                el('cargador').addEventListener('change', (e) => {
                    this.anadir(e.target.files);
                    e.target.value = '';
                });
                document.addEventListener('dragover', (e) => e.preventDefault());
                document.addEventListener('drop', (e) => {
                    e.preventDefault();
                    this.anadir(e.dataTransfer.files);
                });
                document.addEventListener('paste', (e) => this.anadir(e.clipboardData.files));

                const l = this.lienzo;
                l.addEventListener('pointerdown', (e) => this.dedoAbajo(e));
                l.addEventListener('pointermove', (e) => this.dedoMueve(e));
                for (const tipo of ['pointerup', 'pointercancel', 'pointerleave']) {
                    l.addEventListener(tipo, (e) => this.dedoArriba(e));
                }
                l.addEventListener('wheel', (e) => {
                    if (!this.iman) return;
                    e.preventDefault();
                    const p = this.punto(e);
                    this.iman.zoom(e.deltaY < 0 ? 1.1 : 1 / 1.1, p.x, p.y);
                    this.cambio();
                }, { passive: false });

                el('mas').addEventListener('click', () => this.conIman((m) => m.zoom(1.1)));
                el('menos').addEventListener('click', () => this.conIman((m) => m.zoom(1 / 1.1)));
                el('rellenar').addEventListener('click', () => this.conIman((m) => m.rellenar()));
                el('entera').addEventListener('click', () => this.conIman((m) => m.entera()));
                el('girar').addEventListener('click', () => this.conIman((m) => {
                    m.rot = (m.rot + 90) % 360;
                    [m.x, m.y] = [-m.y, m.x];
                }));
                el('copias').addEventListener('input', (e) => this.conIman((m) => {
                    m.copias = Math.max(1, Math.min(60, parseInt(e.target.value, 10) || 1));
                }));
                el('fondo').addEventListener('input', (e) => this.conIman((m) => { m.fondo = e.target.value; }));
                el('quitar').addEventListener('click', () => this.quitar());
                el('png').addEventListener('click', () => this.guardarPng());
                el('pdf').addEventListener('click', () => this.guardarPdf());
                for (const id of ['lineaCorte', 'lineaVisible', 'regla']) {
                    el(id).addEventListener('change', () => this.pintarHojas());
                }
            }

            conIman(f) {
                if (!this.iman) return;
                f(this.iman);
                this.cambio();
            }

            async anadir(archivos) {
                const fotos = [...(archivos || [])].filter((a) => a.type.startsWith('image/'));
                if (!fotos.length) return;
                let fallos = 0;
                for (const foto of fotos) {
                    try {
                        const img = await createImageBitmap(foto, { imageOrientation: 'from-image' });
                        this.imanes.push(new Iman(img, foto.name));
                    } catch {
                        fallos++;
                    }
                }
                if (this.imanes.length) this.elegir(this.imanes.length - 1);
                if (fallos) this.estado(`${fallos} fichero(s) no se pudieron abrir como imagen.`);
            }

            quitar() {
                if (!this.iman) return;
                this.imanes.splice(this.actual, 1);
                this.elegir(Math.min(this.actual, this.imanes.length - 1));
            }

            elegir(i) {
                this.actual = i;
                el('cuerpo').classList.toggle('oculto', !this.iman);
                if (this.iman) {
                    el('copias').value = this.iman.copias;
                    el('fondo').value = this.iman.fondo;
                }
                this.cambio();
            }

            cambio() {
                this.pintarEditor();
                this.pintarTira();
                this.pintarHojas();
                const total = this.lista().length;
                const hojas = Math.ceil(total / HOJA.porHoja);
                this.estado(total ? `${total} ${total === 1 ? 'imán' : 'imanes'} en ${hojas} ${hojas === 1 ? 'hoja' : 'hojas'}` : '');
            }

            estado(texto) {
                el('estado').textContent = texto;
            }

            // --- Ratón y dedos -------------------------------------------------

            // Posición en píxeles de la hoja, medida desde el centro del imán.
            punto(e) {
                const r = this.lienzo.getBoundingClientRect();
                const k = this.lienzo.width / r.width;
                return {
                    x: (e.clientX - r.left) * k - this.lienzo.width / 2,
                    y: (e.clientY - r.top) * k - this.lienzo.height / 2,
                };
            }

            dedoAbajo(e) {
                if (!this.iman) return;
                this.lienzo.setPointerCapture(e.pointerId);
                this.dedos.set(e.pointerId, this.punto(e));
                this.lienzo.classList.add('agarrando');
            }

            dedoMueve(e) {
                if (!this.iman || !this.dedos.has(e.pointerId)) return;
                const antes = [...this.dedos.values()];
                this.dedos.set(e.pointerId, this.punto(e));
                const ahora = [...this.dedos.values()];
                const centro = (p) => ({
                    x: p.reduce((s, q) => s + q.x, 0) / p.length,
                    y: p.reduce((s, q) => s + q.y, 0) / p.length,
                });
                const c0 = centro(antes);
                const c1 = centro(ahora);
                this.iman.x += c1.x - c0.x;
                this.iman.y += c1.y - c0.y;
                if (ahora.length === 2) {
                    const separacion = (p) => Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
                    const d0 = separacion(antes);
                    if (d0 > 0) this.iman.zoom(separacion(ahora) / d0, c1.x, c1.y);
                }
                this.pintarEditor();
            }

            dedoArriba(e) {
                if (!this.dedos.delete(e.pointerId)) return;
                if (!this.dedos.size) {
                    this.lienzo.classList.remove('agarrando');
                    this.cambio();
                }
            }

            // --- Dibujo --------------------------------------------------------

            pintarEditor() {
                const m = this.iman;
                if (!m) return;
                const ctx = this.ctx;
                const lado = this.lienzo.width;
                const c = lado / 2;
                ctx.clearRect(0, 0, lado, lado);
                m.dibujar(ctx, c, c, 1, 0, c);

                // Fuera del corte, casi tapado; la franja que se dobla, oscurecida.
                const corona = (rDentro, rFuera, color) => {
                    ctx.beginPath();
                    if (rFuera) ctx.arc(c, c, rFuera, 0, 2 * Math.PI);
                    else ctx.rect(0, 0, lado, lado);
                    ctx.arc(c, c, rDentro, 0, 2 * Math.PI, true);
                    ctx.fillStyle = color;
                    ctx.fill();
                };
                corona(R_CORTE, 0, 'rgba(233, 236, 239, 0.92)');
                corona(R_VISIBLE, R_CORTE, 'rgba(0, 0, 0, 0.45)');
                for (const [radio, color] of [[R_VISIBLE, 'rgba(255, 255, 255, 0.9)'], [R_CORTE, 'rgba(0, 0, 0, 0.6)']]) {
                    ctx.beginPath();
                    ctx.arc(c, c, radio, 0, 2 * Math.PI);
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                const avisos = [];
                if (!m.cubre(R_VISIBLE)) avisos.push('La foto no llena lo que se ve: asomará el color de fondo.');
                else if (!m.cubre(R_CORTE)) avisos.push('La foto no llega al borde de corte: el canto saldrá con el color de fondo.');
                if (m.escala > 1.5) avisos.push(`Foto muy ampliada (unos ${Math.round(PPP / m.escala)} ppp): puede salir borrosa.`);
                el('aviso').textContent = avisos.join(' ');
            }

            pintarTira() {
                const tira = el('tira');
                tira.replaceChildren(...this.imanes.map((m, i) => {
                    const caja = document.createElement('div');
                    caja.className = 'mini' + (i === this.actual ? ' actual' : '');
                    caja.title = m.nombre;
                    const lienzo = document.createElement('canvas');
                    lienzo.width = lienzo.height = 132;
                    m.dibujar(lienzo.getContext('2d'), 66, 66, 66 / R_VISIBLE, R_VISIBLE, R_VISIBLE);
                    caja.append(lienzo);
                    if (m.copias > 1) {
                        const n = document.createElement('span');
                        n.className = 'copias';
                        n.textContent = '×' + m.copias;
                        caja.append(n);
                    }
                    caja.addEventListener('click', () => this.elegir(i));
                    return caja;
                }));
            }

            // Los imanes de la hoja, con sus copias, en orden.
            lista() {
                return this.imanes.flatMap((m) => Array(m.copias).fill(m));
            }

            paginas() {
                const todos = this.lista();
                const paginas = [];
                for (let i = 0; i < todos.length; i += HOJA.porHoja) paginas.push(todos.slice(i, i + HOJA.porHoja));
                return paginas;
            }

            // Una hoja A4. k = 1 es tamaño de impresión; menos, para la vista previa.
            hoja(imanes, k) {
                const lienzo = document.createElement('canvas');
                lienzo.width = Math.round(HOJA.ancho * k);
                lienzo.height = Math.round(HOJA.alto * k);
                const ctx = lienzo.getContext('2d');
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, lienzo.width, lienzo.height);
                ctx.scale(k, k);

                imanes.forEach((m, i) => {
                    const cx = HOJA.margenX + (i % 2) * HOJA.paso + HOJA.caja / 2;
                    const cy = HOJA.margenY + Math.floor(i / 2) * HOJA.paso + HOJA.caja / 2;
                    m.dibujar(ctx, cx, cy, 1, R_CORTE, R_CORTE);
                    this.guias(ctx, cx, cy);
                });

                if (el('regla').checked) {
                    const largo = mm(50);
                    const x = HOJA.margenX;
                    const y = HOJA.alto - 190;
                    ctx.strokeStyle = ctx.fillStyle = '#555';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(x, y); ctx.lineTo(x + largo, y);
                    ctx.moveTo(x, y - 25); ctx.lineTo(x, y + 25);
                    ctx.moveTo(x + largo, y - 25); ctx.lineTo(x + largo, y + 25);
                    ctx.stroke();
                    ctx.font = '36px sans-serif';
                    ctx.fillText('50 mm · si mide otra cosa, la impresora ha cambiado el tamaño', x + largo + 30, y + 12);
                }
                return lienzo;
            }

            // Las líneas de corte y de lo visible, según las casillas de la hoja.
            guias(ctx, cx, cy) {
                if (el('lineaCorte').checked) this.circulo(ctx, cx, cy, R_CORTE, '#888', []);
                if (el('lineaVisible').checked) this.circulo(ctx, cx, cy, R_VISIBLE, '#888', [12, 12]);
            }

            circulo(ctx, cx, cy, radio, color, trazo) {
                ctx.beginPath();
                ctx.arc(cx, cy, radio, 0, 2 * Math.PI);
                ctx.setLineDash(trazo);
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.setLineDash([]);
            }

            pintarHojas() {
                cancelAnimationFrame(this.pendienteHojas);
                this.pendienteHojas = requestAnimationFrame(() => {
                    el('hojas').replaceChildren(...this.paginas().map((p) => this.hoja(p, 0.15)));
                });
            }

            // --- Guardar -------------------------------------------------------

            descargar(blob, nombre) {
                const enlace = document.createElement('a');
                enlace.href = URL.createObjectURL(blob);
                enlace.download = nombre;
                enlace.click();
                setTimeout(() => URL.revokeObjectURL(enlace.href), 10000);
            }

            // Solo este imán, recortado en círculo y con las mismas guías que la hoja.
            guardarPng() {
                const m = this.iman;
                if (!m) return;
                const lado = 2 * Math.ceil(R_CORTE) + 4;
                const c = lado / 2;
                const lienzo = document.createElement('canvas');
                lienzo.width = lienzo.height = lado;
                const ctx = lienzo.getContext('2d');
                m.dibujar(ctx, c, c, 1, R_CORTE, R_CORTE);
                this.guias(ctx, c, c);
                const base = m.nombre.replace(/\.[^.]+$/, '') || 'iman';
                lienzo.toBlob((blob) => this.descargar(blob, `${base}_iman.png`), 'image/png');
            }

            async guardarPdf() {
                const paginas = this.paginas();
                if (!paginas.length) return;
                el('pdf').disabled = true;
                this.estado('Preparando el PDF…');
                try {
                    const fotos = [];
                    for (const p of paginas) {
                        const blob = await new Promise((ok) => this.hoja(p, 1).toBlob(ok, 'image/jpeg', 0.95));
                        fotos.push(new Uint8Array(await blob.arrayBuffer()));
                    }
                    const hoy = new Date().toISOString().slice(0, 10);
                    this.descargar(pdfDeFotos(fotos, HOJA.ancho, HOJA.alto), `imanes_${hoy}.pdf`);
                    this.estado(`PDF de ${paginas.length} ${paginas.length === 1 ? 'hoja' : 'hojas'} descargado.`);
                } catch (e) {
                    this.estado('No se pudo generar el PDF: ' + e.message);
                } finally {
                    el('pdf').disabled = false;
                }
            }
        }

        // Un PDF mínimo: cada página es un A4 con un JPEG que la ocupa entera.
        function pdfDeFotos(fotos, anchoPx, altoPx) {
            const A4 = [595.276, 841.89];
            const texto = new TextEncoder();
            const trozos = [];
            const posiciones = [];
            let largo = 0;
            const escribir = (dato) => {
                const bytes = typeof dato === 'string' ? texto.encode(dato) : dato;
                trozos.push(bytes);
                largo += bytes.length;
            };
            const objeto = (n, cuerpo, flujo) => {
                posiciones[n] = largo;
                escribir(`${n} 0 obj\n${cuerpo}\n`);
                if (flujo) {
                    escribir('stream\n');
                    escribir(flujo);
                    escribir('\nendstream\n');
                }
                escribir('endobj\n');
            };

            escribir('%PDF-1.4\n%âãÏÓ\n');
            // 1 catálogo, 2 páginas, y por cada hoja: página, contenido e imagen.
            const hijos = fotos.map((_, i) => `${3 + i * 3} 0 R`).join(' ');
            objeto(1, '<< /Type /Catalog /Pages 2 0 R >>');
            objeto(2, `<< /Type /Pages /Kids [${hijos}] /Count ${fotos.length} >>`);
            fotos.forEach((jpeg, i) => {
                const n = 3 + i * 3;
                const contenido = texto.encode(`q ${A4[0]} 0 0 ${A4[1]} 0 0 cm /Im0 Do Q`);
                objeto(n, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${A4[0]} ${A4[1]}] `
                    + `/Resources << /XObject << /Im0 ${n + 2} 0 R >> >> /Contents ${n + 1} 0 R >>`);
                objeto(n + 1, `<< /Length ${contenido.length} >>`, contenido);
                objeto(n + 2, `<< /Type /XObject /Subtype /Image /Width ${anchoPx} /Height ${altoPx} `
                    + `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>`, jpeg);
            });

            const total = 3 + fotos.length * 3;
            const inicioTabla = largo;
            escribir(`xref\n0 ${total}\n0000000000 65535 f \n`);
            for (let n = 1; n < total; n++) escribir(String(posiciones[n]).padStart(10, '0') + ' 00000 n \n');
            escribir(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${inicioTabla}\n%%EOF\n`);
            return new Blob(trozos, { type: 'application/pdf' });
        }

        const app = new Imanmaker();
    </script>
